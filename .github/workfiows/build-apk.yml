name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor প্রজেক্ট তৈরি
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "$OWNER.github.io" ]; then SITE="https://$OWNER.github.io/"; else SITE="https://$OWNER.github.io/$REPO/"; fi
          echo "সাইট: $SITE"
          mkdir -p /tmp/app/www && cd /tmp/app
          echo '<!doctype html><meta charset="utf-8"><title>BANA</title><body style="background:#0a0a0c"></body>' > www/index.html
          echo '{"name":"bana-admin","version":"1.0.0","private":true}' > package.json
          cat > capacitor.config.json <<CFG
          {"appId":"com.banafashion.admin","appName":"BANA Admin","webDir":"www","backgroundColor":"#0a0a0c",
           "server":{"url":"$SITE","androidScheme":"https","allowNavigation":["*.github.io","*.googleapis.com","*.firebaseapp.com","*.gstatic.com","*.google.com"]},
           "android":{"backgroundColor":"#0a0a0c"}}
          CFG
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap add android
          npx cap sync android

      - name: লোগো থেকে অ্যাপ আইকন তৈরি
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          ws = os.environ['GITHUB_WORKSPACE']
          src = os.path.join(ws, 'logo.png')
          if not os.path.exists(src):
              src = os.path.join(ws, 'icon-512.png')
          print('আইকনের উৎস:', src)
          im = Image.open(src).convert('RGBA')
          res = '/tmp/app/android/app/src/main/res'
          def fit(img, size, scale):
              c = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              t = img.copy(); t.thumbnail((int(size * scale), int(size * scale)), Image.LANCZOS)
              c.paste(t, ((size - t.width) // 2, (size - t.height) // 2), t)
              return c
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (l, f) in sizes.items():
              p = f'{res}/mipmap-{d}/'
              sq = Image.new('RGBA', (l, l), (10, 10, 12, 255)); sq.alpha_composite(fit(im, l, 0.78))
              sq.convert('RGB').save(p + 'ic_launcher.png')
              m = Image.new('L', (l * 4, l * 4), 0); ImageDraw.Draw(m).ellipse([0, 0, l * 4 - 1, l * 4 - 1], fill=255)
              m = m.resize((l, l), Image.LANCZOS)
              rd = Image.new('RGBA', (l, l), (0, 0, 0, 0)); rd.paste(sq, (0, 0), m)
              rd.save(p + 'ic_launcher_round.png')
              fit(im, f, 0.58).save(p + 'ic_launcher_foreground.png')
          open(f'{res}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0A0A0C</color></resources>')
          PY

      - name: APK বিল্ড
        working-directory: /tmp/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Releases-এ APK প্রকাশ
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk BANA-Admin.apk
          gh release delete apk-latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create apk-latest BANA-Admin.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BANA Admin APK" --notes "সর্বশেষ অ্যান্ড্রয়েড অ্যাপ"

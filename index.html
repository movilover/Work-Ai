 return`<div class="c p-3 mb-3 flex items-center justify-between"><div><div class="font-extrabold">আসসালামু আলাইকুম</div><div class="text-[11px] text-gray-400">${new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long'})}</div></div><div class="text-right"><div class="text-[10px] text-gray-400">আজকের সেলস</div><div class="text-xl font-extrabold text-amber-400">${tk(oT.reduce((a,o)=>a+o.total,0))}</div></div></div>

 try{if(await SP0(e))toast('প্রোডাক্ট সেভ হয়েছে');else if(bt){bt.disabled=false;bt.innerHTML=h}}catch(x){toast('ত্রুটি: '+x.message,'err');if(bt){bt.disabled=false;bt.innerHTML=h}}return false};

{const f=window.OS;window.OS=async(id,s)=>{await f(id,s);toast('স্ট্যাটাস: '+BL[s])}}

<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>BANA FASHION | Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;background:#0D0D0D;color:#e5e7eb}
.c{background:#161616;border:1px solid #2A2A2A;border-radius:16px}.i{width:100%;background:#0D0D0D;border:1px solid #2A2A2A;border-radius:10px;padding:9px 12px;font-size:13px}
.i:focus{outline:none;border-color:#F59E0B}.b{background:linear-gradient(135deg,#F59E0B,#D97706);color:#000;font-weight:800;border-radius:10px;padding:9px 16px;font-size:13px}
.g{background:#2A2A2A;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700}.t{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:700;white-space:nowrap}.t.on{background:#F59E0B;color:#000}</style></head>
<body>
<div id="setup" class="hidden p-8 text-center">firebaseConfig এ আপনার Firebase key বসান (admin.html এর উপরের অংশে)</div>
<div id="login" class="min-h-screen flex items-center justify-center p-4"><form onsubmit="return L(event)" class="c p-8 w-full max-w-sm space-y-3">
<h1 class="text-2xl font-extrabold text-center">BANA <span class="text-amber-500">FASHION</span></h1><p class="text-center text-xs text-gray-400">Admin Panel</p>
<input id="em" type="email" class="i" placeholder="Admin Email" required><input id="pw" type="password" class="i" placeholder="Password" required>
<button class="b w-full">LOGIN</button><p id="le" class="text-red-400 text-xs text-center"></p></form></div>
<div id="app" class="hidden max-w-6xl mx-auto p-3 sm:p-6">
<div class="flex items-center justify-between mb-4"><h1 class="font-extrabold text-xl">BANA <span class="text-amber-500">ADMIN</span></h1><button class="g" onclick="LO()">Logout</button></div>
<div id="tabs" class="flex gap-2 overflow-x-auto pb-3"></div><div id="v"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getFirestore,collection,doc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,limit,where,documentId,getCountFromServer,getDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
/* >>> storefront (index.html) এর firebaseConfig এর same value বসান <<< */
const cfg={apiKey:"AIzaSyBwMWJ-OMMVR-aeiP9mrwGCqpGzxuranFI",authDomain:"bana-fashion.firebaseapp.com",projectId:"bana-fashion",storageBucket:"bana-fashion.firebasestorage.app",messagingSenderId:"143663802409",appId:"1:143663802409:web:fe1ceb33a3dfa33fe0d438"};
const ADMIN="banafashiongazipur@gmail.com";
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tk=n=>'৳'+Math.round(n||0).toLocaleString('en-US');
if(cfg.apiKey.startsWith('YOUR_')){$('login').classList.add('hidden');$('setup').classList.remove('hidden')}
const app=initializeApp(cfg),db=getFirestore(app),au=getAuth(app);
let OF='all',orders=[],prods=[],cats=[],stats=[],S={},P={},tab='dash',ucount=0,unsub=[];
const TABS=[['dash','Dashboard'],['orders','Orders'],['prods','Products'],['cats','Categories'],['pay','Payment'],['set','Settings']];
const day=(d=new Date())=>d.toLocaleDateString('en-CA'),ts=o=>o.createdAt?.toDate?o.createdAt.toDate():new Date(o.createdAt||0);
window.L=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(au,$('em').value.trim(),$('pw').value)}catch(x){$('le').textContent='Email বা Password ভুল'}return false};
window.LO=()=>signOut(au);
onAuthStateChanged(au,u=>{unsub.forEach(f=>f());unsub=[];
 if(u&&u.email===ADMIN){$('login').classList.add('hidden');$('app').classList.remove('hidden');boot()}
 else{if(u){signOut(au);$('le').textContent='এই account এ Admin access নেই'}$('app').classList.add('hidden');$('login').classList.remove('hidden')}});
async function boot(){
 unsub.push(onSnapshot(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(500)),s=>{orders=s.docs.map(d=>({_id:d.id,...d.data()}));draw()}));
 unsub.push(onSnapshot(collection(db,'products'),s=>{prods=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
 unsub.push(onSnapshot(collection(db,'categories'),s=>{cats=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
 unsub.push(onSnapshot(doc(db,'settings','site'),s=>{S=s.data()||{};draw()}));
 unsub.push(onSnapshot(doc(db,'settings','payment'),s=>{P=s.data()||{};draw()}));
 const ym=day().slice(0,7);
 unsub.push(onSnapshot(query(collection(db,'stats'),where(documentId(),'>=',ym+'-01'),where(documentId(),'<=',ym+'-31')),s=>{stats=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
 try{ucount=(await getCountFromServer(collection(db,'users'))).data().count;draw()}catch(e){}
}
function draw(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="t ${tab===k?'on':'g'}" onclick="T('${k}')">${l}</button>`).join('');$('v').innerHTML=({dash,orders:ord,prods:prd,cats:cat,pay,set:stg})[tab]()}
window.T=k=>{tab=k;draw()};
const card=(l,v,s)=>`<div class="c p-4"><div class="text-[11px] text-gray-400 uppercase font-bold">${l}</div><div class="text-2xl font-extrabold text-amber-400 mt-1">${v}</div>${s?`<div class="text-[11px] text-gray-500 mt-1">${s}</div>`:''}</div>`;
function dash(){const td=day(),ym=td.slice(0,7),st=stats.find(x=>x.id===td)||{},sum=k=>stats.reduce((a,x)=>a+(x[k]||0),0),
 oT=orders.filter(o=>day(ts(o))===td),oM=orders.filter(o=>day(ts(o)).startsWith(ym)),c=f=>orders.filter(f).length,
 rev=oM.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+o.total,0);
 return`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
 ${card('আজকের Site Views',st.views||0,'এই মাসে: '+sum('views'))}${card('আজকের নতুন Account',st.signups||0,'এই মাসে: '+sum('signups')+' | মোট: '+ucount)}
 ${card('আজকের Orders',oT.length,tk(oT.reduce((a,o)=>a+o.total,0)))}${card('এই মাসের Orders',oM.length,'Sales: '+tk(rev))}
 ${card('Pending',c(o=>o.status==='pending'))}${card('Shipped',c(o=>o.status==='shipped'))}${card('মোট Delivered',c(o=>o.status==='delivered'))}
 ${card('Delivery Charge Paid',c(o=>o.deliveryPaid),'Verify বাকি: '+c(o=>o.pay?.trxId&&!o.deliveryPaid))}</div>
 <div class="c p-4 mt-4"><div class="font-bold mb-2 text-sm">গত ৭ দিনের Views</div><div class="flex items-end gap-2 h-32">${[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5),k=day(d),v=(stats.find(x=>x.id===k)||{}).views||0,mx=Math.max(1,...stats.map(x=>x.views||0));return`<div class="flex-1 text-center text-[10px]"><div class="bg-amber-500 rounded-t" style="height:${v/mx*100}px"></div>${v}<br>${k.slice(8)}</div>`}).join('')}</div></div>`}
const SS=['pending','confirmed','shipped','delivered','cancelled'];
const SC_={pending:'bg-yellow-500',confirmed:'bg-blue-500',shipped:'bg-purple-500',delivered:'bg-emerald-500',cancelled:'bg-red-500'};
window.OFl=k=>{OF=k;draw()};
function ord(){const lst=orders.filter(o=>OF==='all'||o.status===OF);return`<div class="flex gap-2 overflow-x-auto pb-3">${['all',...SS].map(k=>`<button class="t ${OF===k?'on':'g'}" onclick="OFl('${k}')">${k.toUpperCase()} (${k==='all'?orders.length:orders.filter(o=>o.status===k).length})</button>`).join('')}</div><div class="space-y-3">${lst.map(o=>`<div class="c p-4 text-sm"><div class="flex flex-wrap justify-between gap-2"><b>${esc(o.orderId)} <span class="${SC_[o.status]||'bg-gray-500'} text-black text-[10px] px-2 py-0.5 rounded-full ml-1 uppercase">${esc(o.status)}</span></b><span class="text-gray-400 text-xs">${ts(o).toLocaleString()}</span></div>
 <div class="mt-1">${esc(o.customerName)} · <a class="text-amber-400" href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · ${esc(o.area)}</div><div class="text-xs text-gray-400">${esc(o.address)} ${o.note?'| '+esc(o.note):''}</div>
 <div class="text-xs mt-2">${(o.items||[]).map(i=>esc(i.title)+' ('+esc(i.size)+') ×'+i.qty).join(', ')}</div>
 <div class="mt-2">Total <b>${tk(o.total)}</b> · Delivery ${tk(o.delivery)}</div>
 <div class="mt-2 p-2 rounded-lg bg-black/40 text-xs">${o.pay?.trxId?`${esc(o.pay.method).toUpperCase()} · Sender ${esc(o.pay.sender)} · TrxID <b>${esc(o.pay.trxId)}</b> `:'Delivery charge: Cash on Delivery '}
 ${o.deliveryPaid?'<span class="text-emerald-400 font-bold">✔ DELIVERY CHARGE PAID</span>':(o.pay?.trxId?`<button class="b !py-1 !px-2 ml-2" onclick="PD('${o._id}',true)">Verify Paid</button>`:'')}${o.deliveryPaid?`<button class="g ml-2" onclick="PD('${o._id}',false)">Undo</button>`:''}</div>
 <div class="mt-3 flex flex-wrap gap-2">${[['pending','⏳ Pending'],['confirmed','✔ Confirm'],['shipped','🚚 Shipped'],['delivered','📦 Delivered'],['cancelled','✖ Cancel']].map(([k,l])=>`<button class="${o.status===k?'b':'g'}" onclick="OS('${o._id}','${k}')">${l}</button>`).join('')}</div>
 <div class="mt-2 grid sm:grid-cols-3 gap-2"><input class="i" id="cn${o._id}" placeholder="Courier" value="${esc(o.courier?.name||'Steadfast')}"><input class="i" id="ct${o._id}" placeholder="Tracking / Consignment ID" value="${esc(o.courier?.tracking||'')}">
 <button class="g" onclick="CS('${o._id}')">Save Courier</button></div></div>`).join('')||'<p class="text-gray-400">কোনো order নেই</p>'}</div>`}
window.PD=(id,v)=>updateDoc(doc(db,'orders',id),{deliveryPaid:v,'pay.status':v?'verified':'pending'});
window.OS=(id,s)=>updateDoc(doc(db,'orders',id),{status:s});
window.CS=id=>updateDoc(doc(db,'orders',id),{courier:{name:$('cn'+id).value.trim(),tracking:$('ct'+id).value.trim()}}).then(()=>alert('Saved'));
function img(f,max=640,q=.72){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,max/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};m.onerror=no;m.src=r.result};r.readAsDataURL(f)})}
let EP=null;
function prd(){const p=EP||{};return`<form onsubmit="return SP(event)" class="c p-4 grid sm:grid-cols-3 gap-2"><input class="i" id="pt" placeholder="Product name" value="${esc(p.title)}" required>
 <select class="i" id="pc">${cats.map(c=>`<option value="${esc(c.id)}" ${p.category===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select><input class="i" id="pb" placeholder="Badge (NEW, HOT)" value="${esc(p.badge)}">
 <input class="i" id="pp" type="number" placeholder="Price" value="${p.price||''}" required><input class="i" id="po" type="number" placeholder="Old price" value="${p.oldPrice||''}"><input class="i" id="pf" type="file" accept="image/*">
 <textarea class="i sm:col-span-3" id="pd" placeholder="Description">${esc(p.description)}</textarea><div class="sm:col-span-3 flex gap-2"><button class="b">${EP?'UPDATE':'ADD'} PRODUCT</button>${EP?'<button type="button" class="g" onclick="EP=null;T(\'prods\')">Cancel</button>':''}</div></form>
 <div class="text-xs text-gray-400 my-2">মোট ${prods.length} টি product</div><div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3">${prods.map(p=>`<div class="c overflow-hidden"><img src="${esc(p.image)}" class="aspect-[4/5] object-cover w-full bg-black"><div class="p-2 text-xs"><div class="font-bold truncate">${esc(p.title)}</div>${tk(p.price)}<div class="flex gap-1 mt-2"><button class="g flex-1" onclick="EPr('${p.id}')">Edit</button><button class="g" onclick="DP('${p.id}')">🗑</button></div></div></div>`).join('')}</div>`}
Object.defineProperty(window,'EP',{get:()=>EP,set:v=>EP=v});
window.EPr=id=>{EP=prods.find(p=>p.id===id);draw();scrollTo(0,0)};
window.DP=id=>confirm('Delete?')&&deleteDoc(doc(db,'products',id));
window.SP=async e=>{e.preventDefault();const f=$('pf').files[0],d={title:$('pt').value.trim(),category:$('pc').value,badge:$('pb').value.trim()||null,price:+$('pp').value,oldPrice:+$('po').value||null,description:$('pd').value.trim(),image:EP?.image||''};
 if(f)d.image=await img(f);if(!d.image){alert('Image দিন');return false}
 if(EP)await updateDoc(doc(db,'products',EP.id),d);else await addDoc(collection(db,'products'),{...d,rating:4.8,reviews:0,createdAt:serverTimestamp()});EP=null;return false};
function cat(){return`<form onsubmit="return SC(event)" class="c p-4 grid sm:grid-cols-4 gap-2"><input class="i" id="ci" placeholder="ID (english, e.g. panjabi)" required pattern="[a-z0-9-]+"><input class="i" id="cl" placeholder="Category name" required><input class="i" id="cf" type="file" accept="image/*"><button class="b">SAVE CATEGORY</button></form>
 <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">${cats.map(c=>`<div class="c overflow-hidden"><img src="${esc(c.image)}" class="aspect-[3/4] object-cover w-full bg-black"><div class="p-2 text-xs flex justify-between"><b>${esc(c.label)}</b><button onclick="DC('${c.id}')">🗑</button></div></div>`).join('')}</div>`}
window.SC=async e=>{e.preventDefault();const id=$('ci').value,f=$('cf').files[0],old=cats.find(c=>c.id===id);await setDoc(doc(db,'categories',id),{label:$('cl').value.trim(),image:f?await img(f,600):(old?.image||''),order:old?.order??Date.now()});return false};
window.DC=id=>confirm('Delete?')&&deleteDoc(doc(db,'categories',id));
const PM=[['bkash','bKash'],['nagad','Nagad'],['rocket','Rocket']];
function pay(){return`<div class="c p-4 space-y-4"><p class="text-xs text-gray-400">Customer এই number এ Delivery Charge পাঠাবে এবং TrxID দেবে। এখানে logo আপলোড করুন।</p>${PM.map(([k,l])=>{const m=P[k]||{};return`<div class="grid sm:grid-cols-4 gap-2 items-center"><div class="flex items-center gap-2 font-bold">${m.logo?`<img src="${m.logo}" class="w-10 h-10 rounded object-contain bg-white">`:`<span class="w-10 h-10 rounded flex items-center justify-center text-[9px] text-white font-extrabold" style="background:${{bkash:'#E2136E',nagad:'#F6921E',rocket:'#8C3494'}[k]}">${l}</span>`}${l}</div>
 <input class="i" id="n${k}" placeholder="${l} Number" value="${esc(m.number)}"><input class="i" id="f${k}" type="file" accept="image/*"><label class="text-xs"><input type="checkbox" id="o${k}" ${m.on!==false?'checked':''}> Active (Checkout এ দেখাবে)</label></div>`}).join('')}<button class="b" onclick="SPay()">SAVE PAYMENT</button></div>`}
window.SPay=async()=>{const d={};for(const[k]of PM){const f=$('f'+k).files[0];d[k]={number:$('n'+k).value.trim(),on:$('o'+k).checked,logo:f?await img(f,200,.85):(P[k]?.logo||'')}}await setDoc(doc(db,'settings','payment'),d);alert('Saved')};
function stg(){return`<div class="c p-4 grid sm:grid-cols-2 gap-3 max-w-xl"><label class="text-xs">Desktop এ এক লাইনে কয়টা product (2-6)<input class="i mt-1" id="sd" type="number" min="2" max="6" value="${S.colsDesktop||4}"></label>
 <label class="text-xs">Mobile এ এক লাইনে (1-2)<input class="i mt-1" id="sm" type="number" min="1" max="2" value="${S.colsMobile||2}"></label>
 <label class="text-xs">Home এ মোট কয়টা product (0 = সব)<input class="i mt-1" id="sx" type="number" min="0" value="${S.maxProducts||0}"></label>
 <label class="text-xs">ঢাকার ভিতরে Delivery Charge (৳)<input class="i mt-1" id="s1" type="number" min="0" value="${S.shipDhaka??80}"></label>
 <label class="text-xs">ঢাকার বাইরে Delivery Charge (৳)<input class="i mt-1" id="s2" type="number" min="0" value="${S.shipOutside??150}"></label>
 <label class="text-xs">Free Delivery এর সর্বনিম্ন Order (৳, 0 = বন্ধ)<input class="i mt-1" id="s3" type="number" min="0" value="${S.freeShip??3000}"></label>
 <label class="text-xs flex items-center gap-2 mt-5"><input type="checkbox" id="sr" ${S.requireAdvance?'checked':''}> Delivery Charge আগে পেমেন্ট বাধ্যতামূলক</label>
 <button class="b sm:col-span-2" onclick="SSet()">SAVE SETTINGS</button></div>`}
window.SSet=async()=>{await setDoc(doc(db,'settings','site'),{colsDesktop:Math.min(6,Math.max(2,+$('sd').value||4)),colsMobile:Math.min(2,Math.max(1,+$('sm').value||2)),maxProducts:Math.max(0,+$('sx').value||0),requireAdvance:$('sr').checked,shipDhaka:+$('s1').value||0,shipOutside:+$('s2').value||0,freeShip:+$('s3').value||0});alert('Saved')};
</script></body></html>

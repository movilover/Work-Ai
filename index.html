 <div><label class="lb">দাম (৳)</label><input class="i" id="pp" type="number" value="${p.price||''}" required></div><div><label class="lb">আগের দাম (৳)</label><input class="i" id="po" type="number" value="${p.oldPrice||''}"></div><div><label class="lb">ছবি</label><input class="i" id="pf" type="file" accept="image/*"></div>
 <div class="sm:col-span-3"><label class="lb">সাইজ বাছাই করুন (ক্লিক করলেই সিলেক্ট)</label>${SG.map(([n,a])=>`<div class="mb-2"><div class="text-[10px] text-gray-500 mb-1">${n}</div><div class="flex flex-wrap gap-2">${a.map(chip).join('')}</div></div>`).join('')}
 ${SZ.filter(s=>!SG.some(g=>g[1].includes(s))).length?`<div class="flex flex-wrap gap-2 mb-2">${SZ.filter(s=>!SG.some(g=>g[1].includes(s))).map(chip).join('')}</div>`:''}<div class="flex gap-2 max-w-xs"><input id="cs" class="i" placeholder="অন্য সাইজ লিখুন"><button type="button" class="g" onclick="AS()">যোগ</button></div></div>
 <div class="sm:col-span-3"><label class="lb">বিবরণ</label><textarea class="i" id="pd" rows="5" placeholder="কাপড়, ফিটিং, সাইজ চার্ট, ধোয়ার নিয়ম... (নতুন লাইনও দেখাবে)">${esc(p.description)}</textarea></div><div class="sm:col-span-3 flex gap-2"><button class="b"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>${EP?'আপডেট করুন':'আপলোড করুন'}</button>${EP?'<button type="button" class="g" onclick="T(\'prods\')">বাতিল</button>':''}</div></form>
 <div class="flex justify-between items-center my-3"><span class="text-xs text-gray-500">মোট ${bn(prods.length)} টি প্রোডাক্ট</span><button class="g" onclick="SD()"><i class="fa-solid fa-download mr-1"></i>ডেমো প্রোডাক্ট ইম্পোর্ট</button></div><div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3">${prods.map(p=>`<div id="pc-${p.id}" class="c overflow-hidden"><img src="${esc(p.image)}" class="aspect-[4/5] object-cover w-full bg-black"><div class="p-3 text-xs"><div class="font-bold truncate">${esc(p.title)}</div><div class="text-amber-400 font-bold">${tk(p.price)}</div><div class="text-gray-500 truncate">${(p.sizes||[]).join(', ')||'—'}</div><div class="flex gap-1 mt-2"><button class="g flex-1" onclick="EPr('${p.id}')"><i class="fa-solid fa-pen"></i></button><button class="g text-red-400" onclick="DP('${p.id}')"><i class="fa-solid fa-trash"></i></button></div></div></div>`).join('')}</div>`}
window.SP=async e=>{e.preventDefault();const f=$('pf').files[0],d={title:$('pt').value.trim(),category:$('pc').value,badge:$('pb').value.trim()||null,price:+$('pp').value,oldPrice:+$('po').value||null,description:$('pd').value.trim(),sizes:SZ,image:EP?.image||''};
 if(f)d.image=await img(f);if(!d.image){alert('ছবি দিন');return false}
 if(EP)await updateDoc(doc(db,'products',EP.id),d);else await addDoc(collection(db,'products'),{...d,rating:4.8,reviews:0,createdAt:serverTimestamp()});EP=null;SZ=[];draw();return false};
function cat(){return`<form onsubmit="return SC(event)" class="c p-4 grid sm:grid-cols-4 gap-3 items-end"><div><label class="lb">ID (ইংরেজিতে, যেমন panjabi)</label><input class="i" id="ci" required pattern="[a-z0-9-]+"></div><div><label class="lb">ক্যাটাগরির নাম</label><input class="i" id="cl" required></div><div><label class="lb">ক্যাটাগরির ছবি</label><input class="i" id="cf" type="file" accept="image/*"></div><button class="b"><i class="fa-solid fa-plus mr-2"></i>সেভ করুন</button></form>
 <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">${cats.map(c=>`<div id="cc-${c.id}" class="c overflow-hidden"><img src="${esc(c.image)}" class="aspect-[3/4] object-cover w-full bg-black"><div class="p-3 text-xs flex justify-between items-center"><b>${esc(c.label)}</b><button class="text-red-400" onclick="DC('${c.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div>`}
window.SC=async e=>{e.preventDefault();const id=$('ci').value,f=$('cf').files[0],old=cats.find(c=>c.id===id);await setDoc(doc(db,'categories',id),{label:$('cl').value.trim(),image:f?await img(f,600):(old?.image||''),order:old?.order??Date.now()});draw();return false};
function ban(){return`<form onsubmit="return SB(event)" class="c p-4 grid sm:grid-cols-2 gap-3"><div class="sm:col-span-2 font-bold"><i class="fa-solid fa-image text-amber-400 mr-2"></i>নতুন ব্যানার (হোম পেজের স্লাইডারে সবার আগে দেখাবে)</div>
 <div><label class="lb">হেডলাইন</label><input class="i" id="bt" required></div><div><label class="lb">ছোট লেখা</label><input class="i" id="bs"></div><div><label class="lb">বাটনের লেখা</label><input class="i" id="bc" value="SHOP NOW"></div>
 <div><label class="lb">বাটন কোন ক্যাটাগরিতে যাবে</label><select class="i" id="bk"><option value="all">সব প্রোডাক্ট</option>${cats.map(c=>`<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('')}</select></div>
 <div class="sm:col-span-2"><label class="lb">ব্যানার ছবি (চওড়া ছবি ভালো, যেমন ১৬০০×৬০০)</label><input class="i" id="bf" type="file" accept="image/*" required></div><button class="b sm:col-span-2"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>ব্যানার আপলোড</button></form>
 <div class="grid sm:grid-cols-2 gap-3 mt-4">${banners.map(b=>`<div id="bc-${b.id}" class="c overflow-hidden"><img src="${esc(b.image)}" class="w-full aspect-[16/6] object-cover"><div class="p-3 flex justify-between items-center text-sm"><b>${esc(b.title)}</b><button class="text-red-400" onclick="DB_('${b.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')||'<p class="text-gray-500 text-sm">কোনো ব্যানার নেই</p>'}</div>`}
window.SB=async e=>{e.preventDefault();await addDoc(collection(db,'banners'),{title:$('bt').value.trim(),sub:$('bs').value.trim(),cta:$('bc').value.trim()||'SHOP NOW',cat:$('bk').value,image:await img($('bf').files[0],1600,.7),order:Date.now()});draw();return false};
function vis(){const st=stats.find(x=>x.id===day())||{};return`<div class="grid grid-cols-3 gap-3 mb-4">${stat('fa-users','#3b82f6','আজকের ভিজিটর',bn(st.visitors||0))}${stat('fa-eye','#8b5cf6','আজকের ভিউ',bn(st.views||0))}${stat('fa-globe','#06b6d4','মোট ভিজিটর',bn(tot.visitors||0))}</div>
 <div class="c p-4"><div class="font-bold text-sm mb-3"><i class="fa-solid fa-list text-amber-400 mr-2"></i>আজকের ভিজিট তালিকা <span class="text-gray-500 font-normal text-xs">(রাত ১২টার পর নতুন তালিকা)</span></div><div class="overflow-x-auto"><table class="w-full text-xs"><tr class="text-gray-500 text-left"><th class="py-2">সময়</th><th>ডিভাইস</th><th>কোথা থেকে</th><th>ধরন</th></tr>${visits.slice(0,200).map(v=>`<tr class="border-t border-white/5"><td class="py-2">${v.t?.toDate?v.t.toDate().toLocaleTimeString('bn-BD'):'—'}</td><td><i class="fa-solid ${v.dev==='Mobile'?'fa-mobile-screen':'fa-desktop'} mr-1 text-gray-500"></i>${esc(v.dev)}</td><td>${esc(v.ref)}</td><td>${v.new?'<span class="text-emerald-400">নতুন</span>':'পুরনো'}</td></tr>`).join('')||'<tr><td colspan="4" class="py-4 text-gray-500">আজ এখনো ভিজিট নেই</td></tr>'}</table></div></div>`}
const PM=[['bkash','বিকাশ','#E2136E'],['nagad','নগদ','#F6921E'],['rocket','রকেট','#8C3494']];
function pay(){return`<div class="c p-4 space-y-4"><p class="text-xs text-gray-400">কাস্টমার এই নাম্বারে ডেলিভারি চার্জ পাঠাবে। লোগো আপলোড না করলে ডিফল্ট আইকন দেখাবে।</p>${PM.map(([k,l,col])=>{const m=P[k]||{};return`<div class="grid sm:grid-cols-4 gap-3 items-end p-3 rounded-xl bg-black/30"><div class="flex items-center gap-3 font-bold">${m.logo?`<img src="${m.logo}" class="w-12 h-12 rounded-xl object-contain bg-white">`:`<span class="w-12 h-12 rounded-xl flex items-center justify-center text-[10px] text-white font-extrabold" style="background:${col}">${l}</span>`}${l}</div>
 <div><label class="lb">${l} নাম্বার</label><input class="i" id="n${k}" value="${esc(m.number)}" placeholder="01XXXXXXXXX"></div><div><label class="lb">লোগো</label><input class="i" id="f${k}" type="file" accept="image/*"></div><label class="text-xs"><input type="checkbox" id="o${k}" ${m.on!==false?'checked':''}> চেকআউটে দেখান</label></div>`}).join('')}<button class="b" onclick="SPay()"><i class="fa-solid fa-floppy-disk mr-2"></i>সেভ করুন</button></div>`}
window.SPay=async()=>{const d={};for(const[k]of PM){const f=$('f'+k).files[0];d[k]={number:$('n'+k).value.trim(),on:$('o'+k).checked,logo:f?await img(f,200,.85):(P[k]?.logo||'')}}await setDoc(doc(db,'settings','payment'),d);alert('সেভ হয়েছে')};
function stg(){return`<div class="c p-4 grid sm:grid-cols-2 gap-3 max-w-2xl"><div class="sm:col-span-2 font-bold"><i class="fa-solid fa-truck text-amber-400 mr-2"></i>ডেলিভারি চার্জ</div>
 <div><label class="lb">ঢাকার ভিতরে (৳)</label><input class="i" id="s1" type="number" value="${S.shipDhaka??80}"></div><div><label class="lb">ঢাকার বাইরে (৳)</label><input class="i" id="s2" type="number" value="${S.shipOutside??150}"></div>
 <div class="sm:col-span-2"><label class="lb">ফ্রি ডেলিভারির সর্বনিম্ন অর্ডার (৳, ০ দিলে বন্ধ)</label><input class="i" id="s3" type="number" value="${S.freeShip??3000}"></div>
 <label class="text-xs sm:col-span-2"><input type="checkbox" id="sr" ${S.requireAdvance?'checked':''}> ডেলিভারি চার্জ আগে পেমেন্ট বাধ্যতামূলক</label>
 <div class="sm:col-span-2 font-bold mt-2"><i class="fa-solid fa-table-cells text-amber-400 mr-2"></i>হোম পেজ লেআউট</div>
 <div><label class="lb">কম্পিউটারে এক লাইনে প্রোডাক্ট (২-৬)</label><input class="i" id="sd" type="number" min="2" max="6" value="${S.colsDesktop||4}"></div><div><label class="lb">মোবাইলে এক লাইনে (১-২)</label><input class="i" id="sm" type="number" min="1" max="2" value="${S.colsMobile||2}"></div>
 <div class="sm:col-span-2"><label class="lb">হোমে মোট কয়টা প্রোডাক্ট (০ = সব)</label><input class="i" id="sx" type="number" min="0" value="${S.maxProducts||0}"></div>
 <button class="b sm:col-span-2" onclick="SSet()"><i class="fa-solid fa-floppy-disk mr-2"></i>সেভ করুন</button></div>`}
window.SSet=async()=>{await setDoc(doc(db,'settings','site'),{colsDesktop:Math.min(6,Math.max(2,+$('sd').value||4)),colsMobile:Math.min(2,Math.max(1,+$('sm').value||2)),maxProducts:Math.max(0,+$('sx').value||0),requireAdvance:$('sr').checked,shipDhaka:+$('s1').value||0,shipOutside:+$('s2').value||0,freeShip:+$('s3').value||0},{merge:true});alert('সেভ হয়েছে')};
const gone=(id,fn)=>{const e=$(id);e&&e.classList.add('gone');setTimeout(fn,300)};
window.CD=(t,fn)=>{const m=document.createElement('div');m.className='fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4';
 m.innerHTML=`<div class="c p-6 max-w-xs w-full text-center pop" style="background:#16161a"><div class="w-16 h-16 mx-auto rounded-full bg-red-500/15 text-red-400 flex items-center justify-center text-2xl shake"><i class="fa-solid fa-trash"></i></div><h3 class="font-extrabold mt-4">ডিলিট করবেন?</h3><p class="text-xs text-gray-400 mt-1 break-words">${esc(t)}</p><p class="text-[11px] text-gray-500 mt-1">এটা আর ফেরত আনা যাবে না</p><div class="grid grid-cols-2 gap-2 mt-5"><button class="g" id="cx">না</button><button class="b" style="background:#ef4444;color:#fff;box-shadow:none" id="cy">হ্যাঁ, ডিলিট</button></div></div>`;
 document.body.appendChild(m);const x=()=>m.remove();m.querySelector('#cx').onclick=x;m.onclick=e=>{if(e.target===m)x()};m.querySelector('#cy').onclick=()=>{x();fn()}};
window.DP=id=>{const p=prods.find(x=>x.id===id);CD(p?.title||'',()=>gone('pc-'+id,()=>deleteDoc(doc(db,'products',id))))};
window.DC=id=>CD(id,()=>gone('cc-'+id,()=>deleteDoc(doc(db,'categories',id))));
window.DB_=id=>CD('ব্যানার',()=>gone('bc-'+id,()=>deleteDoc(doc(db,'banners',id))));
const DU=i=>`https://images.unsplash.com/${i}?auto=format&fit=crop&w=700&q=80`;
const DCT=[['shirts','Shirts','photo-1598033129183-c4f50c736f10'],['tshirts','T-Shirts & Polo','photo-1521572267360-ee0c2909d518'],['jeans','Denim Jeans','photo-1541099649105-f69ad21f3246'],['pants','Pants','photo-1624378439575-d8705ad7ae80'],['jackets','Jackets & Hoodies','photo-1556905055-8f358a7a47b2']];
const DPR=[['Premium Formal Oxford Shirt','shirts',1290,1590,'BESTSELLER','photo-1598033129183-c4f50c736f10','100% breathable cotton Oxford with structured collar and tailored fit. Perfect for office and events.'],
['Heavyweight 240GSM Oversized Tee','tshirts',690,890,'HOT','photo-1521572267360-ee0c2909d518','Ultra-soft combed cotton, dropped shoulders and anti-stretch ribbed collar. Pre-shrunk.'],
['Raw Indigo Stretch Slim Denim','jeans',1790,2190,'TRENDING','photo-1542272604-780c96856592','Comfort-stretch denim with deep indigo wash and strong stitching. Slim fit.'],
['Vintage Washed Straight Jeans','jeans',1850,2290,null,'photo-1541099649105-f69ad21f3246','Mid-rise straight fit with hand-sanded vintage whiskers and triple needle stitching.'],
['Washed Black Tapered Jeans','jeans',1890,2350,'NEW','photo-1582552938357-32b906df40cb','Clean charcoal black wash with a comfortable thigh and a sharp tapered ankle.'],
['Urban Tactical Cargo Pants','pants',1590,1990,'POPULAR','photo-1624378439575-d8705ad7ae80','Durable cotton ripstop cargo with 6 pockets and adjustable ankle cords.'],
['Fleece Pullover Hoodie','jackets',1490,1890,'ESSENTIAL','photo-1556905055-8f358a7a47b2','400GSM brushed fleece, double-layer hood, deep kangaroo pocket and metal-tip drawstrings.'],
['Classic Trucker Jacket','jackets',2490,2990,'LIMITED','photo-1551028719-00167b16eac5','Heavyweight rigid jacket with chest pockets, soft inner lining and adjustable waist.'],
['Signature Cotton Polo','tshirts',890,1150,'NEW','photo-1576566588028-4147f3842f27','Premium pique cotton polo with reinforced collar and clean embroidered finish.'],
['Slim Fit Casual Shirt','shirts',1190,1490,null,'photo-1596755094514-f87e34085b2c','Lightweight everyday casual shirt with a modern slim cut and soft hand-feel.'],
['Stretch Chino Pants','pants',1390,1690,null,'photo-1473966968600-fa801b869a1a','Stretch cotton chino with a smart tapered leg. Dress up or down.'],
['Everyday Basic Tee (Pack Look)','tshirts',590,790,'VALUE','photo-1489987707025-afc232f7ea0f','Soft 180GSM cotton basic tee for daily wear. Regular fit, available in multiple colours.']];
async function seed(){const b=writeBatch(db);DCT.forEach(([id,l,i],n)=>b.set(doc(db,'categories',id),{label:l,image:DU(i),order:n+1}));
 DPR.forEach(([t,c,p,o,bd,i,d],n)=>b.set(doc(db,'products','demo-'+(n+1)),{title:t,category:c,price:p,oldPrice:o,badge:bd,image:DU(i),description:d,sizes:(c==='jeans'||c==='pants')?['30','32','34','36']:['M','L','XL','XXL'],rating:4.7,reviews:0,createdAt:serverTimestamp()}));
 b.set(doc(db,'settings','site'),{seeded:true},{merge:true});await b.commit()}
window.SD=()=>seed().then(()=>alert('ডেমো প্রোডাক্ট ইম্পোর্ট হয়েছে'));
</script></body></html>
